<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bug Hunter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7aa2f7" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="120" cy="80" r="90" fill="#7dcfff" fill-opacity="0.08"/>
  <circle cx="540" cy="320" r="110" fill="#bb9af7" fill-opacity="0.1"/>

  <!-- Player ship -->
  <g transform="translate(300 250)">
    <path d="M20 0 L40 48 L20 36 L0 48 Z" fill="#7aa2f7" stroke="#c0caf5" stroke-width="2"/>
    <rect x="16" y="18" width="8" height="8" rx="1" fill="#7dcfff"/>
  </g>

  <!-- Bugs -->
  <g fill="#f7768e">
    <ellipse cx="160" cy="120" rx="18" ry="12"/>
    <circle cx="148" cy="112" r="3" fill="#1a1b26"/>
    <circle cx="172" cy="112" r="3" fill="#1a1b26"/>
    <path d="M145 120 Q140 130 146 136" stroke="#f7768e" stroke-width="2" fill="none"/>
    <path d="M175 120 Q180 130 174 136" stroke="#f7768e" stroke-width="2" fill="none"/>
  </g>
  <g fill="#e0af68">
    <ellipse cx="480" cy="140" rx="16" ry="11"/>
    <circle cx="470" cy="133" r="2.5" fill="#1a1b26"/>
    <circle cx="490" cy="133" r="2.5" fill="#1a1b26"/>
  </g>
  <g fill="#9ece6a">
    <ellipse cx="420" cy="90" rx="14" ry="10"/>
    <circle cx="412" cy="84" r="2" fill="#1a1b26"/>
    <circle cx="428" cy="84" r="2" fill="#1a1b26"/>
  </g>

  <!-- Title panel -->
  <rect x="40" y="300" width="280" height="64" rx="10" fill="#1f2335" stroke="#414868" stroke-width="2"/>
  <text x="58" y="328" fill="#7dcfff" font-family="ui-monospace, monospace" font-size="14">misael@dev:~$</text>
  <text x="58" y="350" fill="#c0caf5" font-family="ui-monospace, monospace" font-size="22" font-weight="700">BUG HUNTER</text>
  <text x="400" y="344" fill="#9ece6a" font-family="ui-monospace, monospace" font-size="13">PRESS START</text>
</svg>
